name: Build release binaries

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  BINARY_NAME: word-generator

jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: macos-apple-silicon
            runner: macos-15
          - platform: macos-intel
            runner: macos-15-intel

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Build the executable
        shell: bash
        run: cargo build --release --bin "$BINARY_NAME"

      - name: Attach the executable to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ "$PLATFORM" == "windows-x64" ]]; then
            asset="${BINARY_NAME}-${PLATFORM}.exe"
            cp "target/release/${BINARY_NAME}.exe" "$asset"
          else
            asset="${BINARY_NAME}-${PLATFORM}.tar.gz"
            tar -czf "$asset" -C target/release "$BINARY_NAME"
          fi

          gh release upload "$TAG" "$asset" --clobber
